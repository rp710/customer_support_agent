[project]
name = "insurance-agent-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rp710", email = "20it109@charusat.edu.in" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "ipykernel>=7.3.0",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langmem>=0.0.30",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
insurance-agent-project = "insurance_agent_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]
reportUnusedImport = false

[tool.pytest.ini_options]
pythonpath = ["."]
